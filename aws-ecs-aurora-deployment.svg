<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">AWS ECS Application Deployment Model</title>
  <desc id="desc">A deployment diagram showing users entering through Route 53, WAF, and API Gateway, into a VPC with an Application Load Balancer, ECS Fargate tasks in private app subnets, and an Aurora database cluster in private database subnets.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#26384d" flood-opacity="0.12"/>
    </filter>

    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#34495e"/>
    </marker>

    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#2277b8"/>
    </marker>

    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#2e8b57"/>
    </marker>

    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #1e2a36; letter-spacing: 0; }
      .subtitle { font: 400 19px Arial, Helvetica, sans-serif; fill: #64748b; letter-spacing: 0; }
      .section-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }
      .section-note { font: 400 13px Arial, Helvetica, sans-serif; fill: #64748b; letter-spacing: 0; }
      .label { font: 700 18px Arial, Helvetica, sans-serif; fill: #1e293b; letter-spacing: 0; }
      .small-label { font: 700 14px Arial, Helvetica, sans-serif; fill: #1e293b; letter-spacing: 0; }
      .muted { font: 400 13px Arial, Helvetica, sans-serif; fill: #64748b; letter-spacing: 0; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #64748b; letter-spacing: 0; }
      .pill-text { font: 700 13px Arial, Helvetica, sans-serif; fill: #475569; letter-spacing: 0; }
      .callout-text { font: 700 14px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0; }

      .boundary { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .vpc { fill: #f8fbff; stroke: #77a9d8; stroke-width: 3; }
      .subnet-public { fill: #fff7e6; stroke: #e6ad42; stroke-width: 2; }
      .subnet-app { fill: #eef9f1; stroke: #62b477; stroke-width: 2; }
      .subnet-db { fill: #f5efff; stroke: #9670d7; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #d6dee8; stroke-width: 1.5; filter: url(#softShadow); }
      .mini-card { fill: #ffffff; stroke: #d6dee8; stroke-width: 1.5; }
      .edge-card { fill: #ffffff; stroke: #e6b84a; stroke-width: 1.8; filter: url(#softShadow); }
      .service-card { fill: #ffffff; stroke: #71b883; stroke-width: 1.8; filter: url(#softShadow); }
      .db-card { fill: #ffffff; stroke: #9b79d9; stroke-width: 1.8; filter: url(#softShadow); }
      .ops-card { fill: #ffffff; stroke: #9aa7b6; stroke-width: 1.5; filter: url(#softShadow); }
      .sg { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 7 6; }

      .flow { fill: none; stroke: #34495e; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2277b8; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .flow-green { fill: none; stroke: #2e8b57; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flow-dashed { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .legend-line { stroke-width: 3; stroke-linecap: round; }

      .icon-stroke { fill: none; stroke: #334155; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .icon-fill-edge { fill: #ffd166; stroke: #b78012; stroke-width: 2; }
      .icon-fill-compute { fill: #8fd19e; stroke: #2f855a; stroke-width: 2; }
      .icon-fill-db { fill: #c9b2ff; stroke: #6b46c1; stroke-width: 2; }
      .icon-fill-ops { fill: #dbe4ee; stroke: #64748b; stroke-width: 2; }
      .icon-fill-network { fill: #a8d8ff; stroke: #2277b8; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="1120"/>

  <g transform="translate(80,64)">
    <text class="title" x="0" y="0">AWS ECS Application Deployment Model</text>
    <text class="subtitle" x="0" y="34">Public gateway and load balancing into private ECS services with isolated Aurora database access</text>
  </g>

  <g transform="translate(1320,64)">
    <rect class="mini-card" x="0" y="-24" width="380" height="78" rx="14"/>
    <line class="legend-line" x1="26" y1="0" x2="86" y2="0" stroke="#34495e" marker-end="url(#arrow)"/>
    <text class="tiny" x="104" y="4">request path</text>
    <line class="legend-line" x1="26" y1="34" x2="86" y2="34" stroke="#64748b" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
    <text class="tiny" x="104" y="38">platform dependency</text>
    <rect x="254" y="-11" width="18" height="18" rx="4" fill="#eef9f1" stroke="#62b477"/>
    <text class="tiny" x="282" y="4">private</text>
    <rect x="254" y="23" width="18" height="18" rx="4" fill="#fff7e6" stroke="#e6ad42"/>
    <text class="tiny" x="282" y="38">public</text>
  </g>

  <g id="external-users">
    <rect class="boundary" x="76" y="388" width="184" height="194" rx="22" filter="url(#softShadow)"/>
    <circle cx="168" cy="444" r="34" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
    <path class="icon-stroke" d="M 150 441 C 157 431 179 431 186 441"/>
    <path class="icon-stroke" d="M 143 473 C 153 456 183 456 193 473"/>
    <circle cx="157" cy="445" r="3.5" fill="#334155"/>
    <circle cx="179" cy="445" r="3.5" fill="#334155"/>
    <text class="label" x="168" y="524" text-anchor="middle">Users</text>
    <text class="muted" x="168" y="548" text-anchor="middle">web, mobile, API clients</text>
  </g>

  <g id="aws-account">
    <rect class="boundary" x="300" y="150" width="1435" height="850" rx="28"/>
    <text class="section-title" x="336" y="196">AWS Account</text>
    <text class="section-note" x="336" y="220">Managed edge services, VPC networking, ECS compute, and Aurora persistence</text>
  </g>

  <g id="edge-layer">
    <rect class="subnet-public" x="338" y="250" width="374" height="505" rx="22"/>
    <text class="section-title" x="368" y="292">Public Edge</text>
    <text class="section-note" x="368" y="316">TLS, routing, and request filtering</text>

    <g transform="translate(386,356)">
      <rect class="edge-card" width="278" height="90" rx="16"/>
      <circle class="icon-fill-edge" cx="46" cy="45" r="22"/>
      <path class="icon-stroke" d="M 34 45 H 58 M 46 33 V 57"/>
      <text class="label" x="86" y="39">Route 53</text>
      <text class="muted" x="86" y="63">DNS entry point</text>
    </g>

    <g transform="translate(386,488)">
      <rect class="edge-card" width="278" height="90" rx="16"/>
      <path class="icon-fill-edge" d="M 46 22 L 70 33 V 51 C 70 67 59 77 46 82 C 33 77 22 67 22 51 V 33 Z"/>
      <path class="icon-stroke" d="M 36 49 L 43 57 L 58 40"/>
      <text class="label" x="86" y="39">AWS WAF</text>
      <text class="muted" x="86" y="63">managed filtering</text>
    </g>

    <g transform="translate(386,620)">
      <rect class="edge-card" width="278" height="90" rx="16"/>
      <rect class="icon-fill-edge" x="24" y="24" width="44" height="44" rx="10"/>
      <path class="icon-stroke" d="M 34 45 H 58 M 46 33 V 57"/>
      <text class="label" x="86" y="39">API Gateway</text>
      <text class="muted" x="86" y="63">public gateway</text>
    </g>
  </g>

  <g id="vpc">
    <rect class="vpc" x="760" y="250" width="930" height="622" rx="26"/>
    <text class="section-title" x="792" y="292">Application VPC</text>
    <text class="section-note" x="792" y="316">Only the load balancer is internet-facing; compute and data live in private subnets</text>

    <g id="public-subnets">
      <rect class="subnet-public" x="800" y="348" width="250" height="404" rx="20"/>
      <text class="section-title" x="826" y="386">Public Subnets</text>
      <text class="section-note" x="826" y="409">across multiple AZs</text>

      <g transform="translate(834,456)">
        <rect class="mini-card" width="182" height="96" rx="15" fill="#ffffff"/>
        <circle class="icon-fill-network" cx="44" cy="48" r="23"/>
        <path class="icon-stroke" d="M 31 48 H 57 M 44 35 V 61"/>
        <text class="small-label" x="88" y="42">Internet</text>
        <text class="small-label" x="88" y="61">Gateway</text>
      </g>

      <g transform="translate(834,600)">
        <rect class="card" width="182" height="96" rx="15"/>
        <rect class="icon-fill-network" x="22" y="25" width="46" height="46" rx="10"/>
        <path class="icon-stroke" d="M 32 48 H 58"/>
        <path class="icon-stroke" d="M 48 36 L 60 48 L 48 60"/>
        <text class="small-label" x="88" y="42">Application</text>
        <text class="small-label" x="88" y="61">Load Balancer</text>
      </g>
    </g>

    <g id="app-subnets">
      <rect class="subnet-app" x="1090" y="348" width="316" height="404" rx="20"/>
      <text class="section-title" x="1116" y="386">Private App Subnets</text>
      <text class="section-note" x="1116" y="409">ECS service runs without public IPs</text>

      <rect class="sg" x="1124" y="438" width="248" height="274" rx="18"/>
      <text class="pill-text" x="1147" y="468">ECS security group</text>
      <text class="tiny" x="1147" y="489">allows traffic from ALB only</text>

      <g transform="translate(1152,522)">
        <rect class="service-card" width="192" height="82" rx="15"/>
        <rect class="icon-fill-compute" x="22" y="20" width="42" height="42" rx="8"/>
        <path class="icon-stroke" d="M 31 33 H 55 M 31 49 H 55"/>
        <text class="small-label" x="82" y="36">ECS Service</text>
        <text class="muted" x="82" y="58">Fargate launch type</text>
      </g>

      <g transform="translate(1152,626)">
        <rect class="mini-card" width="88" height="56" rx="12"/>
        <rect class="icon-fill-compute" x="18" y="15" width="26" height="26" rx="6"/>
        <text class="tiny" x="52" y="33">Task A</text>
      </g>

      <g transform="translate(1256,626)">
        <rect class="mini-card" width="88" height="56" rx="12"/>
        <rect class="icon-fill-compute" x="18" y="15" width="26" height="26" rx="6"/>
        <text class="tiny" x="52" y="33">Task B</text>
      </g>
    </g>

    <g id="db-subnets">
      <rect class="subnet-db" x="1444" y="348" width="206" height="404" rx="20"/>
      <text class="section-title" x="1470" y="386">Private DB</text>
      <text class="section-title" x="1470" y="408">Subnets</text>
      <text class="section-note" x="1470" y="431">Aurora isolated</text>

      <rect class="sg" x="1472" y="462" width="150" height="236" rx="18"/>
      <text class="pill-text" x="1492" y="492">DB SG</text>
      <text class="tiny" x="1492" y="513">ECS only</text>

      <g transform="translate(1492,546)">
        <rect class="db-card" width="110" height="116" rx="15"/>
        <ellipse class="icon-fill-db" cx="55" cy="34" rx="34" ry="15"/>
        <path class="icon-fill-db" d="M 21 34 V 76 C 21 84 36 92 55 92 C 74 92 89 84 89 76 V 34 Z"/>
        <ellipse cx="55" cy="76" rx="34" ry="15" fill="#d8c8ff" stroke="#6b46c1" stroke-width="2"/>
        <text class="small-label" x="55" y="101" text-anchor="middle">Aurora</text>
      </g>
    </g>
  </g>

  <g id="platform-services">
    <rect class="boundary" x="760" y="900" width="930" height="100" rx="22"/>
    <text class="section-title" x="792" y="940">Platform Services</text>
    <text class="section-note" x="792" y="963">supporting dependencies used by ECS at deploy and runtime</text>

    <g transform="translate(1048,920)">
      <rect class="ops-card" width="164" height="60" rx="14"/>
      <rect class="icon-fill-ops" x="20" y="16" width="30" height="30" rx="7"/>
      <text class="small-label" x="66" y="27">ECR</text>
      <text class="tiny" x="66" y="45">container images</text>
    </g>

    <g transform="translate(1242,920)">
      <rect class="ops-card" width="190" height="60" rx="14"/>
      <path class="icon-fill-ops" d="M 34 14 C 24 14 18 21 18 31 C 18 41 25 48 35 48 C 44 48 51 42 52 34 H 68 V 26 H 52 C 50 19 43 14 34 14 Z"/>
      <circle cx="34" cy="31" r="5" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
      <text class="small-label" x="82" y="27">Secrets Manager</text>
      <text class="tiny" x="82" y="45">credentials</text>
    </g>

    <g transform="translate(1462,920)">
      <rect class="ops-card" width="166" height="60" rx="14"/>
      <rect class="icon-fill-ops" x="18" y="16" width="34" height="30" rx="7"/>
      <path class="icon-stroke" d="M 25 26 H 45 M 25 36 H 39"/>
      <text class="small-label" x="68" y="27">CloudWatch</text>
      <text class="tiny" x="68" y="45">logs / metrics</text>
    </g>
  </g>

  <g id="request-flows">
    <path class="flow" d="M 260 485 H 350"/>
    <path class="flow" d="M 525 446 V 488"/>
    <path class="flow" d="M 525 578 V 620"/>
    <path class="flow" d="M 664 665 C 708 665 718 648 760 648"/>
    <path class="flow-blue" d="M 760 648 H 834"/>
    <path class="flow-blue" d="M 1016 648 H 1090"/>
    <path class="flow-green" d="M 1248 604 V 626"/>
    <path class="flow-green" d="M 1248 682 C 1248 728 1378 728 1472 640"/>
  </g>

  <g id="platform-flows">
    <path class="flow-dashed" d="M 1130 920 C 1130 850 1194 784 1230 710"/>
    <path class="flow-dashed" d="M 1338 920 C 1338 842 1290 790 1268 710"/>
    <path class="flow-dashed" d="M 1522 920 C 1522 828 1370 796 1302 710"/>
  </g>

  <g id="callouts">
    <g transform="translate(812,785)">
      <rect class="mini-card" width="348" height="56" rx="13"/>
      <text class="callout-text" x="22" y="25">Network rule</text>
      <text class="tiny" x="22" y="43">ALB forwards only to ECS target group in private subnets.</text>
    </g>

    <g transform="translate(1190,785)">
      <rect class="mini-card" width="430" height="56" rx="13"/>
      <text class="callout-text" x="22" y="25">Database rule</text>
      <text class="tiny" x="22" y="43">Aurora accepts connections from the ECS security group only.</text>
    </g>
  </g>
</svg>
